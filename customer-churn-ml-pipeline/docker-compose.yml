services:

  # PostgreSQL database
  db:
    image: postgres:16

    environment:
      POSTGRES_DB: churn_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # FastAPI application
  api:
    build: .

    ports:
      - "8000:8000"

    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/churn_db
      MODEL_PATH: models/churn_pipeline.joblib

    depends_on:
      db:
        condition: service_healthy

    volumes:
      - ./models:/app/models

volumes:
  postgres_data: